name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research-tracker-backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: research-tracker-backend/package-lock.json
      - run: npm ci
      - run: node --check server.js
      - run: npm run build --if-present
      - run: |
          for f in $(git ls-files "*.js"); do
            node --check "$f"
          done

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: research-tracker-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: research-tracker-frontend/package-lock.json
      - run: npm ci
      - run: npm run build
